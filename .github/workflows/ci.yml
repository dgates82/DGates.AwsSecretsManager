name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x' # dotnet CLI tooling; net48 is the build/test target framework

      - name: Setup Mono
        run: sudo apt-get install -y mono-complete

      - name: Restore
        run: dotnet restore DGates.AwsSecretsManager.sln

      - name: Build
        run: dotnet build DGates.AwsSecretsManager.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test --configuration Release --no-build --filter "Category!=Integration"

      - name: Start LocalStack
        run: |
          docker run -d --name localstack -p 4566:4566 \
            -e SERVICES=secretsmanager -e DEFAULT_REGION=us-west-2 \
            localstack/localstack:3
          for i in {1..20}; do
            curl -sf http://localhost:4566/_localstack/health && break
            sleep 3
          done

      - name: Seed LocalStack secrets
        run: |
          chmod +x ./docker/seed-secrets.sh
          ./docker/seed-secrets.sh

      - name: Integration tests
        run: dotnet test --configuration Release --no-build --filter "Category=Integration"

      - name: Stop LocalStack
        if: always()
        run: docker rm -f localstack || true

  pack:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: dotnet pack src/DGates.AwsSecretsManager --configuration Release --output ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg