name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Setup Mono
        run: sudo apt-get install -y mono-complete

      - name: Restore
        run: dotnet restore DGates.AwsSecretsManager.sln

      - name: Build
        run: dotnet build DGates.AwsSecretsManager.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test --configuration Release --no-build --filter "Category!=Integration"

      - name: Start LocalStack
        run: |
          docker run -d --name localstack -p 4566:4566 \
            -e SERVICES=secretsmanager -e DEFAULT_REGION=us-west-2 \
            localstack/localstack:3
          for i in {1..20}; do
            curl -sf http://localhost:4566/_localstack/health && break
            sleep 3
          done

      - name: Seed LocalStack secrets
        run: |
          chmod +x ./docker/seed-secrets.sh
          ./docker/seed-secrets.sh

      - name: Integration tests
        run: dotnet test --configuration Release --no-build --filter "Category=Integration"

      - name: Stop LocalStack
        if: always()
        run: docker rm -f localstack || true

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet pack src/DGates.AwsSecretsManager --configuration Release \
            /p:Version=$VERSION --output ./artifacts

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg
